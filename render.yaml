services:
  - type: web
    name: news-mind-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: newsmind-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false

databases:
  - name: newsmind-db
    plan: free
