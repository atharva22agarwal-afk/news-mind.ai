services:
  - type: web
    name: news-mind-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Firebase is used as the database. Ensure FIREBASE_SERVICE_ACCOUNT_PATH or raw JSON is set in Render env.
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false

# Databases are now managed in Firebase console
