<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsMind Comparison</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap"
        rel="stylesheet">
    <script src="api-config.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-cream: #FDFCF8;
            --text-dark: #1a1a1a;
            --primary-orange: #E76F51;
            --surface-white: #FFFFFF;
            --border-glass: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        nav {
            height: 60px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(253, 252, 248, 0.8);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            text-decoration: none;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--primary-orange);
            font-size: 1.4rem;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: #888;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary-orange);
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .header-section h1 {
            font-family: 'Merriweather', serif;
            font-size: 2.8rem;
            color: var(--text-dark);
            margin-bottom: 15px;
        }

        .header-section p {
            color: #666;
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .compare-inputs {
            background: var(--surface-white);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
            margin-bottom: 40px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            border: 1px solid #ddd;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            background: #f9f9f9;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--primary-orange);
            background: white;
            box-shadow: 0 0 0 3px rgba(231, 111, 81, 0.1);
        }

        .btn-compare {
            width: 100%;
            padding: 16px;
            background: var(--text-dark);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-compare:hover {
            background: var(--primary-orange);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 111, 81, 0.2);
        }
        
        .btn-compare:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #results {
            display: none;
            animation: fadeIn 0.5s ease-up;
            margin-top: 40px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .report-card {
            background: var(--surface-white);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
        }

        /* Markdown Styles for Report */
        .report-card h1, .report-card h2, .report-card h3 {
            font-family: 'Merriweather', serif;
            color: var(--text-dark);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .report-card h1 { border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; color: var(--primary-orange); }
        
        .report-card ul, .report-card ol {
            padding-left: 20px;
            margin-bottom: 1em;
            color: #444;
        }

        .report-card li { margin-bottom: 8px; }

        .report-card p {
            margin-bottom: 1.2em;
            color: #444;
            line-height: 1.7;
        }

        .report-card strong { color: var(--text-dark); }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.95rem;
        }

        th {
            background: #fdf2f0;
            color: var(--primary-orange);
            padding: 12px;
            text-align: left;
            border: 1px solid #eee;
        }

        td {
            padding: 12px;
            border: 1px solid #eee;
            color: #444;
            vertical-align: top;
        }

        @media (max-width: 768px) {
            .input-row { grid-template-columns: 1fr; gap: 15px; }
            .header-section h1 { font-size: 2rem; }
            nav { padding: 0 15px; }
        }
    </style>
</head>

<body>
    <nav>
        <div style="display:flex; align-items:center;">
            <a href="dashboard.html" class="logo"><i class="ph-fill ph-brain"></i> NewsMind.AI</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="war-room.html" class="nav-link">War Room</a>
                <a href="chat.html" class="nav-link">Chat</a>
                <a href="compare.html" class="nav-link active">Compare</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Forensic News Comparison</h1>
            <p>Paste two URLs below for a deep AI-driven bias and fact-checking report.</p>
        </div>

        <div class="compare-inputs">
            <div class="input-row">
                <div class="input-group">
                    <label>Source Alpha</label>
                    <input type="text" id="url1" placeholder="https://source-one.com/article">
                </div>
                <div class="input-group">
                    <label>Source Bravo</label>
                    <input type="text" id="url2" placeholder="https://source-two.com/article">
                </div>
            </div>
            <button class="btn-compare" onclick="runCompare()">
                <i class="ph-fill ph-scales"></i> Generate Intelligence Report
            </button>
        </div>

        <div id="results">
            <div class="report-card" id="report">
                <!-- Report Markdown Here -->
            </div>
        </div>
    </div>

    <script>
        async function runCompare() {
            const u1 = document.getElementById('url1').value;
            const u2 = document.getElementById('url2').value;
            if (!u1 || !u2) return alert("Both targets required.");

            const btn = document.querySelector('.btn-compare');
            btn.innerHTML = `<i class="ph ph-spinner ph-spin"></i> Analyzing Targets...`;
            btn.disabled = true;

            try {
                const res = await fetch(API.toolsCompare, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url1: u1, url2: u2 })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('results').style.display = 'block';
                    document.getElementById('report').innerHTML = marked.parse(data.data);
                    window.scrollTo({ top: document.getElementById('results').offsetTop - 100, behavior: 'smooth' });
                }
            } catch (e) { alert("Analysis failed: " + e.message); }

            btn.innerHTML = `<i class="ph-fill ph-scales"></i> Generate Intelligence Report`;
            btn.disabled = false;
        }
    </script>
</body>

</html>
