<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsMind AI Chat</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap"
        rel="stylesheet">
    <script src="api-config.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-cream: #FDFCF8;
            --text-dark: #1a1a1a;
            --surface-glass: rgba(255, 255, 255, 0.7);
            --border-glass: rgba(0, 0, 0, 0.08);
            --primary-orange: #E76F51;
            --accent-yellow: #E9C46A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        nav {
            height: 60px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(253, 252, 248, 0.8);
            backdrop-filter: blur(15px);
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            text-decoration: none;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .logo i {
            color: var(--primary-orange);
            font-size: 1.4rem;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            margin-left: 40px;
        }

        .nav-link {
            text-decoration: none;
            color: #888;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary-orange);
        }

        .app-container {
            display: flex;
            height: calc(100vh - 60px);
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Chat Sidebar (History) */
        .sidebar {
            width: 300px;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            backdrop-filter: blur(10px);
        }

        .history-item {
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            background: #fff;
            border: 1px solid var(--border-glass);
            transition: 0.3s;
        }

        .history-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .history-item.active {
            background: #fdf2f0;
            border-color: var(--primary-orange);
        }

        /* Chat Stage */
        .chat-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            scrollbar-width: thin;
        }

        .message {
            max-width: 85%;
            padding: 18px 24px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 1.05rem;
            position: relative;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ai-message {
            align-self: flex-start;
            background: #fff;
            border: 1px solid var(--border-glass);
            border-bottom-left-radius: 4px;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .user-message {
            align-self: flex-end;
            background: var(--text-dark);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .chat-input-container {
            padding: 24px 40px;
            background: #fdfcf8;
            border-top: 1px solid var(--border-glass);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 24px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(231, 111, 81, 0.1);
        }

        .chat-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px;
            font-size: 1rem;
            font-family: 'Inter';
            color: var(--text-dark);
        }

        .btn-send {
            width: 44px;
            height: 44px;
            background: var(--primary-orange);
            color: white;
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-send:hover {
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .sidebar {
                display: none;
            }

            .chat-messages {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div style="display:flex; align-items:center;">
            <a href="dashboard.html" class="logo"><i class="ph-fill ph-brain"></i> NewsMind.AI</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="war-room.html" class="nav-link">War Room</a>
                <a href="chat.html" class="nav-link active">Chat</a>
                <a href="compare.html" class="nav-link">Compare</a>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <h3
                style="font-size:0.75rem; color:#999; text-transform:uppercase; letter-spacing:1px; margin-bottom:20px;">
                AI Conversations</h3>
            <div id="history-container">
                <div class="history-item active">
                    <div style="font-weight:600; font-size:0.9rem;">Global News Analysis</div>
                    <div style="font-size:0.75rem; color:#aaa; margin-top:4px;">Just now</div>
                </div>
            </div>
            <button onclick="newChat()"
                style="margin-top:auto; padding:12px; background:var(--text-dark); color:white; border-radius:8px; border:none; cursor:pointer; font-weight:600;">+
                New Discussion</button>
        </aside>

        <main class="chat-stage">
            <div class="chat-messages" id="chatFeed">
                <div class="message ai-message">
                    <strong>AI Analyst:</strong> Hello! I'm ready for a deep-dive discussion on any news topic. What's
                    on your mind today?
                </div>
            </div>

            <div class="chat-input-container">
                <div class="input-wrapper">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Message NewsMind AI...">
                    <button class="btn-send" onclick="sendMsg()"><i class="ph-fill ph-paper-plane-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'login.html';

        async function sendMsg() {
            const inp = document.getElementById('chatInput');
            const txt = inp.value.trim();
            if (!txt) return;
            const feed = document.getElementById('chatFeed');

            // Add user message
            feed.innerHTML += `<div class="message user-message">${txt}</div>`;
            inp.value = '';
            feed.scrollTop = feed.scrollHeight;

            // Add loading indicator
            const loadingId = 'ai-loading-' + Date.now();
            feed.innerHTML += `<div class="message ai-message" id="${loadingId}"><strong>AI Analyst:</strong> <i class="ph ph-spinner ph-spin"></i> Processing intelligence...</div>`;
            feed.scrollTop = feed.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: txt })
                });
                const data = await res.json();

                const loadingEl = document.getElementById(loadingId);
                if (data.success) {
                    loadingEl.innerHTML = `<strong>AI Analyst:</strong> ${marked.parse(data.data.response)}`;
                    if (data.data.sources && data.data.sources.length > 0) {
                        let sourcesHtml = '<div style="margin-top:10px; font-size:0.8rem; color:#888; border-top:1px solid #eee; padding-top:8px;"><strong>Sources:</strong><ul style="padding-left:15px; margin-top:5px;">';
                        data.data.sources.forEach(s => {
                            sourcesHtml += `<li><a href="${s.link}" target="_blank" style="color:var(--primary-orange);">${s.title}</a></li>`;
                        });
                        sourcesHtml += '</ul></div>';
                        loadingEl.innerHTML += sourcesHtml;
                    }
                } else {
                    loadingEl.innerHTML = `<strong>AI Analyst:</strong> <span style="color:red;">Error: ${data.message}</span>`;
                }
            } catch (e) {
                const loadingEl = document.getElementById(loadingId);
                loadingEl.innerHTML = `<strong>AI Analyst:</strong> <span style="color:red;">Intelligence failure: ${e.message}</span>`;
            }
            feed.scrollTop = feed.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(); });
        function newChat() { document.getElementById('chatFeed').innerHTML = `<div class="message ai-message"><strong>AI Analyst:</strong> New session initialized. What shall we analyze today?</div>`; }
    </script>
</body>

</html>
