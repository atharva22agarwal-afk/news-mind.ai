<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsMind War Room</title>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="api-config.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        :root {
            --bg-charcoal: #0F0F11;
            --surface-glass: rgba(30, 30, 35, 0.6);
            --surface-glass-hover: rgba(40, 40, 45, 0.8);
            --border-glass: rgba(255, 255, 255, 0.08);
            --primary-orange: #E76F51;
            --accent-yellow: #E9C46A;
            --text-main: #ECECEC;
            --text-muted: #888888;
            --neon-glow: 0 0 15px rgba(231, 111, 81, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-charcoal);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(231, 111, 81, 0.08) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(42, 157, 143, 0.08) 0%, transparent 20%);
        }

        /* --- NAVIGATION --- */
        nav {
            height: 60px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(15, 15, 17, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .logo i {
            color: var(--primary-orange);
            font-size: 1.4rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 30px;
            background: var(--border-glass);
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .user-profile:hover {
            border-color: var(--primary-orange);
            background: var(--surface-glass-hover);
        }

        .avatar {
            width: 28px;
            height: 28px;
            background: var(--primary-orange);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .logout-menu {
            position: absolute;
            top: 45px;
            right: 0;
            background: var(--bg-charcoal);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 10px;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 200;
        }

        .logout-menu.active {
            display: block;
        }

        .logout-btn {
            padding: 8px 15px;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: rgba(255, 77, 77, 0.1);
            border-radius: 4px;
        }

        /* --- LAYOUT GRID --- */
        .war-room-container {
            display: grid;
            grid-template-columns: 260px 1fr 380px;
            height: calc(100vh - 60px);
            gap: 0;
        }

        /* --- LEFT SIDEBAR (LIBRARY) --- */
        .sidebar {
            background: var(--surface-glass);
            border-right: 1px solid var(--border-glass);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .btn-new {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-orange), #d65a3b);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--neon-glow);
            transition: 0.3s;
        }

        .btn-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(231, 111, 81, 0.5);
        }

        .history-list {
            margin-top: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: center;
            color: var(--text-muted);
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .history-item:hover {
            background: var(--border-glass);
            color: var(--text-main);
        }

        .history-item.active {
            background: rgba(231, 111, 81, 0.1);
            border-color: var(--primary-orange);
            color: var(--primary-orange);
        }

        /* --- CENTER STAGE (COMPARISON/INTEL) --- */
        .main-stage {
            position: relative;
            padding: 30px 40px;
            overflow-y: auto;
            background: transparent;
        }

        /* Omni-Input Styling */
        .war-room-input {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(20px);
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            align-items: center;
        }

        .mode-toggle {
            display: flex;
            background: #000;
            border-radius: 20px;
            padding: 4px;
        }

        .mode-btn {
            padding: 6px 16px;
            border-radius: 16px;
            color: #666;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .mode-btn.active {
            background: var(--text-main);
            color: #000;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: 'Inter';
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 2px rgba(231, 111, 81, 0.2);
        }

        .btn-analyze {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary-orange);
            color: var(--primary-orange);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        .btn-analyze:hover {
            background: var(--primary-orange);
            color: white;
        }

        /* Output Area */
        .intel-output {
            color: #ccc;
            line-height: 1.7;
            display: none;
            animation: fadeIn 0.5s;
            width: 100%;
        }

        .intel-card {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        /* Markdown Tables Override for Dark Mode */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.9rem;
        }

        th {
            background: rgba(231, 111, 81, 0.1);
            color: var(--primary-orange);
            padding: 12px;
            text-align: left;
            border: 1px solid var(--border-glass);
        }

        td {
            padding: 12px;
            border: 1px solid var(--border-glass);
            color: #ccc;
            vertical-align: top;
        }

        /* --- RIGHT SIDEBAR (LIVE FEED) --- */
        .live-feed-panel {
            border-left: 1px solid var(--border-glass);
            background: rgba(15, 15, 17, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-badge {
            font-size: 0.7rem;
            color: #4ADE80;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #4ADE80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ADE80;
            animation: pulse 1.5s infinite;
        }

        .feed-stream {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .tweet-card {
            padding: 20px 0;
            border-bottom: 1px solid var(--border-glass);
            animation: slideIn 0.3s ease-out;
        }

        .tweet-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .tweet-author {
            color: var(--primary-orange);
            font-weight: 700;
        }

        .tweet-content {
            font-size: 0.9rem;
            color: #ddd;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .tweet-actions {
            display: flex;
            gap: 15px;
            font-size: 1.1rem;
            color: #666;
        }

        .tweet-actions i:hover {
            color: var(--primary-orange);
            cursor: pointer;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid var(--border-glass);
            background: var(--bg-charcoal);
        }

        .chat-tools {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: #aaa;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tool-btn:hover {
            background: rgba(231, 111, 81, 0.1);
            color: var(--primary-orange);
            border-color: var(--primary-orange);
        }

        .input-wrapper {
            position: relative;
        }

        .chat-input {
            width: 100%;
            background: #222;
            border: none;
            padding: 12px 40px 12px 15px;
            border-radius: 25px;
            color: white;
            font-size: 0.9rem;
        }

        .send-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            background: var(--primary-orange);
            border-radius: 50%;
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Animations */
        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        @media (max-width: 1100px) {
            .war-room-container {
                grid-template-columns: 80px 1fr 300px;
            }

            .sidebar span {
                display: none;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo"><i class="ph-fill ph-brain"></i> NewsMind OS <span
                style="font-size:0.7rem; background:#333; padding:2px 6px; border-radius:4px; color:#888;">WAR
                ROOM</span></a>
        <div class="user-profile" onclick="toggleLogoutMenu()">
            <span id="user-name-display" style="font-size: 0.85rem;">Guest</span>
            <div class="avatar" id="user-avatar">G</div>
            <div class="logout-menu" id="logout-menu">
                <div class="logout-btn" onclick="handleLogout()">Logout</div>
            </div>
        </div>
    </nav>

    <div class="war-room-container">
        <!-- 1. LEFT SIDEBAR -->
        <aside class="sidebar">
            <button onclick="resetDashboard()" class="btn-new">
                <i class="ph-bold ph-plus"></i> <span>New Operation</span>
            </button>
            <div
                style="margin-top:25px; font-size:0.75rem; color:#666; text-transform:uppercase; letter-spacing:1px; font-weight:700;">
                Recent Intel</div>
            <div class="history-list" id="history-container">
                <!-- History Items Injected Here -->
            </div>
        </aside>

        <!-- 2. MAIN STAGE (COMPARISON/ANALYSIS) -->
        <main class="main-stage">

            <div class="war-room-input" id="inputSection">
                <div class="input-header">
                    <h2 style="font-size:1.2rem; display:flex; align-items:center; gap:8px;"><i
                            class="ph-fill ph-crosshair"></i> Intelligence Gathering</h2>
                    <div class="mode-toggle">
                        <div class="mode-btn active" onclick="switchMode('compare')">Compare</div>
                        <div class="mode-btn" onclick="switchMode('summary')">Analyze</div>
                    </div>
                </div>

                <!-- Compare Mode -->
                <div id="compare-mode" style="display:block;">
                    <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:15px;">Target two sources for
                        bias detection.</p>
                    <div class="compare-grid">
                        <input type="text" id="urlA" placeholder="Source Alpha (URL)...">
                        <input type="text" id="urlB" placeholder="Source Bravo (URL)...">
                    </div>
                    <button onclick="runWarRoomAnalysis()" class="btn-analyze" id="analyze-btn">Initiate Deep
                        Comparison</button>
                </div>

                <!-- Summary Mode -->
                <div id="summary-mode" style="display:none;">
                    <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:15px;">Paste content for AI
                        intelligence extracting.</p>
                    <textarea id="textInput" rows="3" placeholder="Paste intelligence text or URL here..."
                        style="resize:none;"></textarea>
                    <button onclick="runSummary()" class="btn-analyze" id="summary-btn">Run Intelligence Probe</button>
                </div>
            </div>

            <!-- RESULTS AREA -->
            <div id="intel-display" class="intel-output">
                <div class="intel-card">
                    <div
                        style="display:flex; justify-content:space-between; margin-bottom:20px; border-bottom:1px solid var(--border-glass); padding-bottom:15px;">
                        <h3 style="color:var(--primary-orange);"><i class="ph-fill ph-file-text"></i> Tactical Report
                        </h3>
                        <div style="font-family:'JetBrains Mono'; font-size:0.8rem; color:#666;" id="intel-status">
                            STATUS: STANDBY</div>
                    </div>
                    <div id="report-content" style="font-size: 1rem;"></div>
                </div>
            </div>

        </main>

        <!-- 3. RIGHT SIDEBAR (LIVE FEED) -->
        <aside class="live-feed-panel">
            <div class="feed-header">
                <div style="font-weight:700; font-size:0.95rem;">Global Intelligence Feed</div>
                <div class="live-badge">
                    <div class="live-dot"></div> Live
                </div>
            </div>

            <div class="feed-stream" id="feed-stream">
                <!-- Public Feed Injected Here -->
            </div>

            <!-- CHAT INPUT -->
            <div class="chat-input-area">
                <div class="chat-tools">
                    <button class="tool-btn" onclick="insertTemplate('debate')"><i class="ph-bold ph-chats"></i>
                        Debate</button>
                    <button class="tool-btn" onclick="insertTemplate('factcheck')"><i
                            class="ph-bold ph-check-circle"></i> Verify</button>
                    <button class="tool-btn"
                        style="margin-left:auto; color:var(--primary-orange); border-color:rgba(231,111,81,0.3);"
                        onclick="pushToMain()"><i class="ph-bold ph-arrow-left"></i> Analyze This</button>
                </div>
                <div class="input-wrapper">
                    <input type="text" id="feedInput" class="chat-input" placeholder="Broadcast to feed...">
                    <button class="send-btn" onclick="postToFeed()"><i
                            class="ph-fill ph-paper-plane-right"></i></button>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // --- AUTH & STATE ---
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('userName') || 'Guest';
        if (!userId) window.location.href = 'login.html';

        document.getElementById('user-name-display').innerText = userName;
        document.getElementById('user-avatar').innerText = userName.charAt(0).toUpperCase();

        const socket = io();

        // --- UI UTILS ---
        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (mode === 'compare') {
                document.querySelectorAll('.mode-btn')[0].classList.add('active');
                document.getElementById('compare-mode').style.display = 'block';
                document.getElementById('summary-mode').style.display = 'none';
            } else {
                document.querySelectorAll('.mode-btn')[1].classList.add('active');
                document.getElementById('compare-mode').style.display = 'none';
                document.getElementById('summary-mode').style.display = 'block';
            }
        }

        function toggleLogoutMenu() { document.getElementById('logout-menu').classList.toggle('active'); }
        function handleLogout() { localStorage.clear(); window.location.href = 'login.html'; }

        function showLoading(msg) {
            const output = document.getElementById('intel-display');
            const report = document.getElementById('report-content');
            output.style.display = 'block';
            document.getElementById('intel-status').innerText = 'STATUS: ACQUIRING...';
            report.innerHTML = `<div style="text-align:center; padding:60px; color:var(--primary-orange);"><i class="ph ph-spinner ph-spin" style="font-size:2.5rem;"></i><br><br>${msg}</div>`;
        }

        // --- FEED LOGIC (REAL-TIME) ---
        async function loadFeed() {
            try {
                const res = await fetch(API.getPublicFeed);
                const data = await res.json();
                if (data.success) {
                    const stream = document.getElementById('feed-stream');
                    stream.innerHTML = '';
                    data.data.forEach(p => addPostToUI(p));
                }
            } catch (e) { }
        }

        function addPostToUI(post, isNew = false) {
            const stream = document.getElementById('feed-stream');
            const div = document.createElement('div');
            div.className = 'tweet-card';
            const time = new Date(post.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `
                <div class="tweet-meta">
                    <span class="tweet-author">@${post.authorName || 'anonymous'}</span>
                    <span>${time}</span>
                </div>
                <div class="tweet-content">${post.content}</div>
                <div class="tweet-actions">
                    <i class="ph ph-heart"></i>
                    <i class="ph ph-arrow-square-out" onclick="runOnInput('${post.content.replace(/'/g, "\\'")}')" title="Analyze this content"></i>
                </div>
            `;
            if (isNew) stream.prepend(div); else stream.appendChild(div);
        }

        async function postToFeed() {
            const input = document.getElementById('feedInput');
            const content = input.value.trim();
            if (!content) return;

            try {
                const res = await fetch(API.postToFeed, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, authorName: userName, authorId: userId })
                });
                const data = await res.json();
                if (data.success) {
                    socket.emit('new-public-post', data.data);
                    input.value = '';
                }
            } catch (e) { }
        }

        socket.on('public-post-broadcast', (post) => {
            addPostToUI(post, true);
        });

        // --- ANALYSIS LOGIC ---
        async function runWarRoomAnalysis() {
            const urlA = document.getElementById('urlA').value.trim();
            const urlB = document.getElementById('urlB').value.trim();
            if (!urlA || !urlB) return alert("Alpha and Bravo targets required.");

            showLoading("Parsing Sources & Detecting Bias...");

            try {
                const res = await fetch(API.toolsCompare, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url1: urlA, url2: urlB })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('intel-status').innerText = 'STATUS: VERIFIED';
                    document.getElementById('report-content').innerHTML = marked.parse(data.data);
                    loadHistory();
                } else {
                    throw new Error(data.error);
                }
            } catch (e) {
                document.getElementById('report-content').innerHTML = `<p style="color:red">Intelligence failure: ${e.message}</p>`;
            }
        }

        async function runSummary() {
            const input = document.getElementById('textInput').value.trim();
            if (!input) return;

            showLoading("Extracting Core Intel...");

            try {
                const isUrl = input.startsWith('http');
                const endpoint = isUrl ? API.summarizeURL : API.summarizeText;
                const body = isUrl ? { url: input, userId } : { text: input, userId };

                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('intel-status').innerText = 'STATUS: COMPLETE';
                    const summary = data.data;
                    let html = `## ${summary.title}\n\n${summary.summary}\n\n### Key Highlights:\n` +
                        summary.keyPoints.map(p => `- ${p}`).join('\n');
                    document.getElementById('report-content').innerHTML = marked.parse(html);
                    loadHistory();
                }
            } catch (e) {
                document.getElementById('report-content').innerHTML = `<p style="color:red">Analysis failure: ${e.message}</p>`;
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${API.getSummaries}?userId=${userId}&limit=10`);
                const data = await res.json();
                if (data.success) {
                    const container = document.getElementById('history-container');
                    container.innerHTML = '';
                    data.data.summaries.forEach(s => {
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        div.innerHTML = `<i class="ph ph-lightning"></i> <span>${s.title.substring(0, 20)}...</span>`;
                        div.onclick = () => loadHistoricalIntel(s.id);
                        container.appendChild(div);
                    });
                }
            } catch (e) { }
        }

        async function loadHistoricalIntel(id) {
            showLoading("Rekindling Historical Intel...");
            try {
                const res = await fetch(API.getSummary(id));
                const data = await res.json();
                if (data.success) {
                    document.getElementById('intel-status').innerText = 'STATUS: HISTORICAL';
                    const s = data.data;
                    let html = `## ${s.title}\n\n${s.summary}\n\n### Key Highlights:\n` +
                        s.keyPoints.map(p => `- ${p}`).join('\n');
                    document.getElementById('report-content').innerHTML = marked.parse(html);
                }
            } catch (e) { }
        }

        function resetDashboard() {
            document.getElementById('intel-display').style.display = 'none';
            document.getElementById('urlA').value = '';
            document.getElementById('urlB').value = '';
            document.getElementById('textInput').value = '';
        }

        function insertTemplate(type) {
            const input = document.getElementById('feedInput');
            input.value = type === 'debate' ? "[DEBATE]: " : "[VERIFY]: ";
            input.focus();
        }

        function pushToMain() {
            const val = document.getElementById('feedInput').value;
            if (val) { switchMode('summary'); document.getElementById('textInput').value = val; document.getElementById('feedInput').value = ''; }
        }

        function runOnInput(txt) {
            switchMode('summary');
            document.getElementById('textInput').value = txt;
            runSummary();
        }

        // --- INIT ---
        window.addEventListener('load', () => {
            loadFeed();
            loadHistory();
        });

        document.getElementById('feedInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') postToFeed();
        });
    </script>
</body>

</html>
