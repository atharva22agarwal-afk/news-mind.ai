<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsMind Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,700;1,300&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <script src="api-config.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-cream: #FDFCF8;
            --text-dark: #3D3531;
            --primary-orange: #E76F51;
            --accent-yellow: #E9C46A;
            --surface-white: #FFFFFF;
            --border-glass: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3 { font-family: 'Merriweather', serif; }
        a { text-decoration: none; color: inherit; }

        /* Navigation */
        nav {
            height: 60px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(253, 252, 248, 0.8);
            backdrop-filter: blur(15px);
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .logo i {
            color: var(--primary-orange);
            font-size: 1.4rem;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            margin-left: 40px;
        }

        .nav-link {
            text-decoration: none;
            color: #888;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-link:hover, .nav-link.active { color: var(--primary-orange); }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 30px;
            background: var(--border-glass);
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .user-profile:hover {
            border-color: var(--primary-orange);
            background: rgba(255, 255, 255, 0.5);
        }

        .avatar {
            width: 28px;
            height: 28px;
            background: var(--primary-orange);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .logout-menu {
            position: absolute;
            top: 45px;
            right: 0;
            background: white;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 10px;
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            z-index: 200;
        }

        .logout-menu.active {
            display: block;
        }

        .logout-btn {
            padding: 8px 15px;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: rgba(255, 77, 77, 0.05);
            border-radius: 4px;
        }

        .app-container {
            display: flex;
            height: calc(100vh - 60px);
            gap: 0;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            background: var(--surface-white);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: center;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .history-item:hover { background: #f9f9f9; }
        .history-item.active { background: #fdf2f0; border-color: var(--primary-orange); color: var(--primary-orange); }

        .icon-bg {
            width: 32px;
            height: 32px;
            background: #fdf2f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-orange);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            position: relative;
            background: transparent;
        }

        .summary-container {
            padding: 40px 60px 100px;
            overflow-y: auto;
            height: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .summary-container p {
            line-height: 1.7;
            margin-bottom: 1.2em;
            color: #444;
        }

        .summary-container h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5em;
            color: var(--text-dark);
        }

        .input-bar-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 700px;
            background: var(--surface-white);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            outline: none;
            color: var(--text-dark);
            padding-left: 10px;
        }

        .social-sidebar {
            width: 300px;
            background: var(--surface-white);
            border-left: 1px solid var(--border-glass);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .moderator-banner {
            background: #fdf2f0;
            border: 1px solid #f9e0db;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ADE80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ADE80;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            max-width: 85%;
        }

        .ai-msg {
            background: #fdfcf8;
            border: 1px solid #eee;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-msg {
            background: var(--primary-orange);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        @media (max-width:1000px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div style="display:flex; align-items:center;">
            <a href="dashboard.html" class="logo"><i class="ph-fill ph-brain"></i> NewsMind.AI</a>
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link active">Dashboard</a>
                <a href="war-room.html" class="nav-link">War Room</a>
                <a href="chat.html" class="nav-link">Chat</a>
                <a href="compare.html" class="nav-link">Compare</a>
            </div>
        </div>
        <div class="user-profile" onclick="toggleLogoutMenu()">
            <span id="user-name-display">Loading...</span>
            <div class="avatar" id="user-avatar">?</div>
            <div class="logout-menu" id="logout-menu">
                <div class="logout-btn" onclick="handleLogout()">Logout</div>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <h3
                style="font-size:0.75rem; color:#999; text-transform:uppercase; letter-spacing:1px; margin-bottom:15px;">
                Your Intelligence</h3>
            <div id="history-container" style="flex:1; overflow-y:auto;"></div>
            <button onclick="handleNewProject()"
                style="margin-top:20px; padding:12px; background:var(--text-dark); color:white; border-radius:8px; border:none; cursor:pointer; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px;">
                <i class="ph-bold ph-plus"></i> New Project
            </button>
        </aside>

        <main class="main-content">
            <div id="contentText" class="summary-container">
                <div style="text-align:center; padding:100px 50px; color:#999;">
                    <i class="ph ph-sparkle" style="font-size:4rem; color:var(--primary-orange); opacity:0.3;"></i>
                    <h2 style="margin-top:20px; color:#444;">Welcome to NewsMind</h2>
                    <p>Enter a URL or text below to generate a premium intelligence report.</p>
                </div>
            </div>

            <div class="input-bar-container">
                <i class="ph ph-plus" style="font-size:1.2rem; color:#888; padding-left:10px; cursor:pointer;"
                    onclick="handleFileClick()"></i>
                <input type="text" class="main-input" id="main-input" placeholder="Paste URL or type intel text...">
                <button onclick="handleInputSubmit()"
                    style="width:40px; height:40px; border-radius:50%; background:var(--primary-orange); border:none; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center;">
                    <i class="ph-fill ph-paper-plane-right"></i>
                </button>
            </div>
        </main>

        <aside class="social-sidebar">
            <div class="moderator-banner">
                <div><strong>AI Analyst</strong>
                    <div style="font-size:0.7rem; opacity:0.8;">Operational</div>
                </div>
                <div class="status-dot"></div>
            </div>
            <div class="chat-area" id="chatFeed">
                <div class="chat-bubble ai-msg"><strong>AI:</strong> Hello! Generate a summary to begin our forensic
                    analysis.</div>
            </div>
            <div
                style="display:flex; gap:10px; margin-top:20px; background:#f9f9f9; padding:10px; border-radius:12px; border:1px solid #eee;">
                <input type="text" id="chatInput" placeholder="Ask questions about this intel..."
                    style="flex:1; border:none; background:transparent; font-size:0.9rem; outline:none;">
                <button onclick="sendMsg()"
                    style="background:none; border:none; color:var(--primary-orange); cursor:pointer;"><i
                        class="ph-bold ph-paper-plane-right" style="font-size:1.2rem;"></i></button>
            </div>
        </aside>
    </div>

    <input type="file" id="fileInput" accept=".pdf,.txt" style="display:none;">

    <script>
        const userId = localStorage.getItem('userId');
        const userName = localStorage.getItem('userName') || 'User';
        if (!userId) window.location.href = 'login.html';

        document.getElementById('user-name-display').textContent = userName;
        document.getElementById('user-avatar').textContent = userName.charAt(0).toUpperCase();

        let currentSummaryId = null;

        function toggleLogoutMenu() { document.getElementById('logout-menu').classList.toggle('active'); }
        function handleLogout() { localStorage.clear(); window.location.href = 'login.html'; }

        async function handleInputSubmit() {
            const input = document.getElementById('main-input').value.trim();
            if (!input) return;
            const isUrl = input.startsWith('http');
            showLoading("Synthesizing Intelligence...");
            try {
                const res = await fetch(isUrl ? API.summarizeURL : API.summarizeText, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [isUrl ? 'url' : 'text']: input, userId })
                });
                const data = await res.json();
                if (data.success) {
                    displaySummary(data.data);
                    currentSummaryId = data.data.id;
                    loadHistory();
                }
            } catch (e) { showError(e.message); }
            document.getElementById('main-input').value = '';
        }

        function displaySummary(data) {
            const container = document.getElementById('contentText');
            const bias = data.insights?.bias || data.biasAnalysis?.label || 'Neutral';
            const sentiment = data.insights?.sentiment || data.sentiment || 'Objective';

            container.innerHTML = `
                <div style="border-bottom:2px solid #f0f0f0; padding-bottom:25px; margin-bottom:30px;">
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <span style="background:var(--accent-yellow); font-weight:700; font-size:0.7rem; padding:4px 8px; border-radius:4px; text-transform:uppercase;">Tactical Briefing</span>
                        <span style="background:#f0f0f0; font-weight:700; font-size:0.7rem; padding:4px 8px; border-radius:4px; text-transform:uppercase;">${bias}</span>
                        <span style="background:#f0f0f0; font-weight:700; font-size:0.7rem; padding:4px 8px; border-radius:4px; text-transform:uppercase;">${sentiment}</span>
                    </div>
                    <h1 style="margin:10px 0;">${data.title}</h1>
                    <p style="font-size:0.85rem; color:#888;">AI Forensic Analysis • ${new Date().toLocaleDateString()}</p>
                </div>
                <div class="summary-body">${marked.parse(data.summary)}</div>
                ${data.insights?.missingContext ? `<div style="margin-top:30px; padding:20px; background:#FFF4E5; border-radius:12px; border-left:4px solid var(--primary-orange); font-size:0.9rem;"><strong>Forensic Note:</strong> ${data.insights.missingContext}</div>` : ''}
            `;
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${API.getSummaries}?userId=${userId}&limit=10`);
                const data = await res.json();
                if (data.success) {
                    const container = document.getElementById('history-container');
                    container.innerHTML = '';
                    data.data.summaries.forEach(s => {
                        const item = document.createElement('div');
                        item.className = 'history-item';
                        item.innerHTML = `
                            <div class="icon-bg"><i class="ph ph-file-text"></i></div>
                            <div style="font-weight:600; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:150px;">${s.title}</div>
                        `;
                        item.onclick = () => loadSpecificSummary(s.id || s._id);
                        container.appendChild(item);
                    });
                }
            } catch (e) { }
        }

        async function loadSpecificSummary(id) {
            const res = await fetch(API.getSummary(id));
            const data = await res.json();
            if (data.success) displaySummary(data.data);
        }

        function showLoading(msg) {
            document.getElementById('contentText').innerHTML = `<div style="text-align:center; padding:100px;"><i class="ph ph-spinner ph-spin" style="font-size:3rem; color:var(--primary-orange);"></i><p style="margin-top:20px;">${msg}</p></div>`;
        }

        window.onload = loadHistory;

        // Enter key listeners
        document.getElementById('main-input').addEventListener('keypress', e => { if (e.key === 'Enter') handleInputSubmit(); });
        document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') sendMsg(); });

        async function sendMsg() {
            const inp = document.getElementById('chatInput');
            const txt = inp.value.trim();
            if (!txt) return;
            const feed = document.getElementById('chatFeed');
            feed.innerHTML += `<div class="chat-bubble user-msg">${txt}</div>`;
            inp.value = '';
            feed.scrollTop = feed.scrollHeight;

            // Basic AI reaction
            setTimeout(() => {
                feed.innerHTML += `<div class="chat-bubble ai-msg"><strong>AI:</strong> Analyzing your request... Forensic data indicates high relevance to the current briefing.</div>`;
                feed.scrollTop = feed.scrollHeight;
            }, 600);
        }
    </script>
</body>

</html>
